<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <rect width="64" height="64" rx="15" fill="#0a1220"/>
  <!-- voice ripples -->
  <circle cx="44" cy="20" r="6" fill="none" stroke="#43CFFF" stroke-width="2" opacity="0">
    <animate attributeName="r" values="6;18" dur="2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.8;0" dur="2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="44" cy="20" r="6" fill="none" stroke="#43CFFF" stroke-width="2" opacity="0">
    <animate attributeName="r" values="6;18" dur="2s" begin="1s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.8;0" dur="2s" begin="1s" repeatCount="indefinite"/>
  </circle>
  <!-- C -->
  <path d="M40 40.5A15 15 0 1 1 40 23.5" fill="none" stroke="#ffffff" stroke-width="6.5" stroke-linecap="round" transform="translate(-2 4)"/>
  <!-- plus -->
  <g stroke="#43CFFF" stroke-width="5" stroke-linecap="round" transform-origin="44 20">
    <path d="M44 14v12M38 20h12"/>
    <animateTransform attributeName="transform" type="scale" values="1;1.25;1" dur="2s" repeatCount="indefinite" additive="sum"/>
  </g>
</svg>
